<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Ayang Tersayang ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Pustaka Confetti Aman -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c20 0%, #1a103c 40%, #2a0845 70%, #4a1240 100%);
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart-icon {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 105, 180, 0.6);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.3); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 35px 25px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: #fff;
        }

        .avatar {
            font-size: 55px;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(236, 72, 153, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #f472b6;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message-box {
            min-height: 100px;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 18px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
            text-align: left;
        }

        .message {
            color: #f1f5f9;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1rem;
            background-color: #ec4899;
            margin-left: 2px;
            vertical-align: middle;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 55px;
            position: relative;
        }

        .btn {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ec4899, #f43f5e);
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: absolute;
            right: 30px;
        }

        .success-content {
            display: none;
            padding: 10px 0;
        }

        .success-content h2 {
            color: #f472b6;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .success-content p {
            color: #f1f5f9;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="heartsContainer"></div>

    <div class="container" id="mainCard">
        <div class="avatar" id="mainAvatar">💖</div>
        <h1>Halo Ayang Sayang ✨</h1>
        <p class="subtitle">Pesan Spesial Khusus Buat Kamu</p>

        <div id="quizSection">
            <div class="message-box">
                <p class="message"><span id="typedText"></span><span class="cursor" id="cursor"></span></p>
            </div>

            <div class="btn-group">
                <button class="btn btn-yes" onclick="onYesClick()">Mau Banget! 💕</button>
                <button class="btn btn-no" id="btnNo" onmouseover="moveNoButton()" ontouchstart="moveNoButton()">Enggak 😜</button>
            </div>
        </div>

        <div class="success-content" id="successContent">
            <h2>Yaaaay! 🎉❤️</h2>
            <p>Makasih ya udah milih "Mau"! Aku janji bakal bikin hari-hari kamu jadi paling bahagia. I love you so much! 🌸✨</p>
        </div>
    </div>

    <script>
        const textToType = "Makasih ya udah hadir di hidup aku. Setiap hari rasanya lebih cerah sejak ada kamu. Minggu ini jalan bareng yuk? 🥺💖";
        const typedTextElement = document.getElementById("typedText");
        const cursorElement = document.getElementById("cursor");
        let index = 0;

        function typeWriter() {
            if (index < textToType.length) {
                typedTextElement.innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeWriter, 40);
            } else {
                cursorElement.style.display = "none";
            }
        }

        window.onload = () => {
            setTimeout(typeWriter, 400);
            createHearts();
        };

        function createHearts() {
            const container = document.getElementById("heartsContainer");
            const heartIcons = ['❤️', '💖', '💕', '💗', '✨'];
            
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart-icon");
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (Math.random() * 3 + 5) + "s";
                container.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 8000);
            }, 400);
        }

        const btnNo = document.getElementById("btnNo");
        function moveNoButton() {
            const card = document.getElementById("mainCard");
            const cardRect = card.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxX = cardRect.width - btnRect.width - 40;
            const maxY = cardRect.height - btnRect.height - 40;

            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - (maxY / 2);

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function onYesClick() {
            document.getElementById("quizSection").style.display = "none";
            document.getElementById("successContent").style.display = "block";
            document.getElementById("mainAvatar").innerText = "🥰";

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
